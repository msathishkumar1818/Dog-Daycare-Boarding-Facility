<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Owner Login | Canine Haven Dog Daycare &amp; Boarding Facility</title>
  <meta name="description" content="Log in to the Canine Haven Pet Parent Portal to book daycare and boarding dates, view live webcams, track daily activity updates, and manage payments.">
  <link rel="icon" type="image/png" href="assets/images/logo/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="login-page-body">

  <!-- ==============================================================
       BRANDED PAGE LOADER (Matching Home 1 Exactly)
       ============================================================== -->
  <div id="pageLoader" class="page-loader" aria-hidden="true">
    <div class="loader-inner">
      <div class="loader-logo-wrap">
        <img src="assets/images/logo/logo.png" alt="Canine Haven Brand Logo" class="loader-logo" width="90" height="90">
        <div class="loader-spinner"></div>
      </div>
      <h2 class="loader-title">Canine Haven</h2>
      <p class="loader-subtitle">Pet Owner Portal</p>
    </div>
  </div>

  <!-- Top Right Utility Navigation Pills (Matches Reference Screenshot 1) -->
  <aside class="login-top-bar" aria-label="Quick Navigation">
    <a href="index.html" class="auth-nav-pill" id="loginHomeBtn" aria-label="Return to Homepage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>HOME</span>
    </a>
    <button type="button" class="auth-nav-pill rtl-toggle-btn" id="loginRtlToggleBtn" aria-label="Toggle RTL layout direction">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="16 3 21 8 16 13"></polyline>
        <line x1="21" y1="8" x2="9" y2="8"></line>
        <polyline points="8 21 3 16 8 11"></polyline>
        <line x1="3" y1="16" x2="15" y2="16"></line>
      </svg>
      <span>RTL</span>
    </button>
    <button type="button" class="auth-nav-pill theme-toggle-btn auth-theme-toggle" id="loginThemeToggleBtn" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
      </svg>
      <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </aside>

  <!-- Centered Login Card (Matching Screenshot 1 Model with Canine Haven Theme) -->
  <main class="login-card-container">
    
    <!-- Brand Header -->
    <a href="index.html" class="login-brand-header" aria-label="Canine Haven Homepage">
      <div class="login-brand-icon-wrap">
        <img src="assets/images/logo/logo.png" alt="Canine Haven Brand Logo">
      </div>
      <div class="login-brand-titles">
        <span class="login-brand-name">CANINE HAVEN</span>
        <span class="login-brand-tag">PET OWNER PORTAL</span>
      </div>
    </a>

    <!-- Titles -->
    <h1 class="login-main-title">Welcome back</h1>
    <p class="login-sub-text">Enter your credentials to access your account dashboard</p>

    <!-- Segmented Mode Switcher (Sign In / Register) -->
    <div class="auth-segmented-switcher" role="tablist" aria-label="Authentication Type">
      <button type="button" class="auth-tab-btn active" id="tabSignIn" role="tab" aria-selected="true" aria-controls="panelSignIn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>SIGN IN</span>
      </button>
      <button type="button" class="auth-tab-btn" id="tabRegister" role="tab" aria-selected="false" aria-controls="panelRegister">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span>REGISTER</span>
      </button>
    </div>

    <!-- 1. SIGN IN FORM PANEL -->
    <div class="auth-form-panel" id="panelSignIn" role="tabpanel" aria-labelledby="tabSignIn">
      <form id="loginForm" action="dashboard.html" method="get">
        
        <!-- Email Input -->
        <div class="auth-field-group">
          <label for="loginEmail" class="auth-field-label">EMAIL ADDRESS</label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input type="email" id="loginEmail" name="email" class="auth-text-input" placeholder="parent@caninehaven.com" value="alex.carter@caninehaven.com" required autocomplete="email">
          </div>
        </div>

        <!-- Password Input -->
        <div class="auth-field-group" style="margin-top: 0.55rem;">
          <div class="auth-label-row">
            <label for="loginPassword" class="auth-field-label">PASSWORD</label>
            <a href="#forgot" class="auth-field-link" id="forgotPwLink">Forgot password?</a>
          </div>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="loginPassword" name="password" class="auth-text-input" placeholder="••••••••••••" value="goldenRetriever2026" required autocomplete="current-password">
            <button type="button" class="auth-pw-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div style="margin-top: 0.55rem; margin-bottom: 0.75rem;">
          <label class="auth-remember-row">
            <input type="checkbox" id="rememberMeCheckbox" checked>
            <span>Remember me for 30 days</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-primary-submit" id="submitLoginBtn">
          <span>SIGN IN</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <!-- OR CONTINUE WITH Divider -->
      <div class="auth-divider-line">
        <span>OR CONTINUE WITH</span>
      </div>

      <!-- Social Login Buttons -->
      <div class="auth-social-row">
        <button type="button" class="btn-auth-social" id="btnGoogleAuth" onclick="window.location.href='dashboard.html'">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Google</span>
        </button>
        <button type="button" class="btn-auth-social" id="btnAppleAuth" onclick="window.location.href='dashboard.html'">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.62-.75 1.04-1.8 0.93-2.84-.9.04-1.99.6-2.63 1.35-.57.65-1.07 1.72-.94 2.74 1 .08 2.02-.5 2.64-1.25z"/>
          </svg>
          <span>Apple</span>
        </button>
      </div>

      <!-- Bottom Prompt -->
      <div style="text-align: center;">
        <span class="auth-switch-footer-text">Don't have an account? </span>
        <button type="button" class="auth-switch-link" id="toRegisterLink">Register now</button>
      </div>

    </div>

    <!-- 2. REGISTER FORM PANEL -->
    <div class="auth-form-panel is-hidden" id="panelRegister" role="tabpanel" aria-labelledby="tabRegister">
      <form id="registerForm" action="dashboard.html" method="get">
        
        <!-- Parent Full Name -->
        <div class="auth-field-group">
          <label for="regFullName" class="auth-field-label">YOUR FULL NAME</label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="regFullName" name="fullName" class="auth-text-input" placeholder="Alex Carter" value="Alex Carter" required>
          </div>
        </div>

        <!-- Pet Name & Breed -->
        <div class="auth-field-group" style="margin-top: 0.55rem;">
          <label for="regPetDetails" class="auth-field-label">DOG'S NAME &amp; BREED</label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="m8 14 2 2 4-4"></path>
              </svg>
            </span>
            <input type="text" id="regPetDetails" name="petDetails" class="auth-text-input" placeholder="e.g. Max (Golden Retriever)" value="Max (Golden Retriever)" required>
          </div>
        </div>

        <!-- Email Address -->
        <div class="auth-field-group" style="margin-top: 0.55rem;">
          <label for="regEmail" class="auth-field-label">EMAIL ADDRESS</label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </span>
            <input type="email" id="regEmail" name="email" class="auth-text-input" placeholder="alex.carter@caninehaven.com" value="alex.carter@caninehaven.com" required>
          </div>
        </div>

        <!-- Create Password -->
        <div class="auth-field-group" style="margin-top: 0.55rem;">
          <label for="regPassword" class="auth-field-label">CREATE PASSWORD</label>
          <div class="auth-input-container">
            <span class="auth-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="regPassword" name="password" class="auth-text-input" placeholder="Minimum 8 characters" value="goldenRetriever2026" required>
          </div>
        </div>

        <!-- Agreement Checkbox -->
        <div style="margin-top: 0.55rem; margin-bottom: 0.75rem;">
          <label class="auth-remember-row">
            <input type="checkbox" id="regTermsCheckbox" checked required>
            <span>I accept Canine Haven Safety &amp; Biosecurity Protocols</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-primary-submit" id="submitRegisterBtn">
          <span>CREATE ACCOUNT</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </form>

      <!-- Bottom Prompt -->
      <div style="text-align: center; margin-top: 0.65rem;">
        <span class="auth-switch-footer-text">Already registered? </span>
        <button type="button" class="auth-switch-link" id="toSignInLink">Sign in here</button>
      </div>

    </div>

  </main>

  <!-- Global Master JavaScript -->
  <script src="assets/js/main.js"></script>
</body>
</html>
